workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Codemagic Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meet.minutes
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: Add app-level privacy manifest
        script: |
          cat > ios/Runner/PrivacyInfo.xcprivacy << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyTracking</key>
              <false/>
              <key>NSPrivacyTrackingDomains</key>
              <array/>
              <key>NSPrivacyCollectedDataTypes</key>
              <array/>
              <key>NSPrivacyAccessedAPITypes</key>
              <array>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>CA92.1</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryFileTimestamp</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>C617.1</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryDiskSpace</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>E174.1</string>
                      </array>
                  </dict>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategorySystemBootTime</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>35F9.1</string>
                      </array>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF
      - name: Clear corrupted SPM cache
        script: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ios/SourcePackages
      - name: Safe manual build increment
        script: |
          cd $CM_BUILD_DIR
          # Manually updating the version block to guarantee a clean build number increment
          current_build=$(grep 'version:' pubspec.yaml | cut -d '+' -f 2)
          next_build=$((current_build + 1))
          sed -i '' "s/version: 1.0.0+.*/version: 1.0.0+$next_build/" pubspec.yaml
          echo "Updated build number to: $next_build"
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --export-options-plist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
